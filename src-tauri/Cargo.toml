[package]
name = "skills-panel"
version = "0.8.2"
edition = "2021"
rust-version = "1.77.2"
description = "Agent Skill Unified Management Tool"

[[bin]]
name = "skills-panel"
path = "src/main.rs"

[[bin]]
name = "skills-cli"
path = "src/bin/cli.rs"
required-features = ["cli"]

[features]
default = []
cli = ["clap", "colored", "tabled", "indicatif"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
mockito = "1"

[dependencies]
anyhow = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2"
sha2 = "0.10"
zip = "2"
thiserror = "2"
dirs = "6"
notify = { version = "7", features = ["macos_kqueue"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
git2 = { version = "0.19", features = ["vendored-openssl"] }
fs2 = "0.4"
aes-gcm = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
base64 = "0.22"
which = "7"
tokio = { version = "1", features = ["process", "rt", "macros"] }
flate2 = "1"
tar = "0.4"
clap = { version = "4", features = ["derive", "cargo"], optional = true }
colored = { version = "2", optional = true }
tabled = { version = "0.16", optional = true }
indicatif = { version = "0.17", optional = true }
